:root{
  --bg:#000;--txt:#e6e2d6;--white:#ece8dc;--cyan:#6cc3cf;--yellow:#eecb62;--green:#86c46f;--pink:#d27a9f;--red:#d9695f;
  --grey:#7fa3b8;--card:#101d29;--shadow:#233847;--bar:#243f73;--lcd:#14170c;--key:#1c1c1c;--btn:#c9c4b6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:'VT323',monospace;font-size:22px;overscroll-behavior:none}
body{display:flex;justify-content:center}
#app{position:relative;width:100%;max-width:460px;height:100dvh;display:flex;flex-direction:column;overflow:hidden;
  background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0,rgba(255,255,255,.035) 1px,transparent 1px,transparent 3px)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.px{font-family:'Pixelify Sans',sans-serif;font-weight:600}
.bar{white-space:nowrap;display:flex;justify-content:space-between;align-items:center;padding:6px 12px;padding-top:calc(6px + env(safe-area-inset-top));background:var(--bar);color:var(--white);font-size:20px;flex-shrink:0}
.main{flex:1;display:flex;flex-direction:column;min-height:0;overflow-y:auto;scrollbar-width:none}
.main::-webkit-scrollbar{display:none}
.grow{flex:1}
.pad{padding:0 16px}
.foot{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 16px calc(16px + env(safe-area-inset-bottom));flex-shrink:0}
.btn{min-height:50px;display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-bottom:4px solid #777;background:var(--btn);color:#000;font-family:'Pixelify Sans',sans-serif;font-weight:600;font-size:17px;text-decoration:none;padding:0 8px}
.btn:active{transform:translateY(2px);border-bottom-width:2px}
.btn.g{background:var(--green);border-bottom-color:#44693a}
.btn.p{background:var(--pink);border-bottom-color:#6e3a52}
.btn.o{background:transparent;border:3px solid var(--cyan);color:var(--cyan)}
.btn[disabled]{opacity:.5}
.blink{animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
.bob{animation:bob 2.4s steps(4) infinite}@keyframes bob{50%{transform:translateY(-4px)}}
/* accueil */
.logo{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 16px 12px}
.logo svg{width:140px;height:auto}
.title{margin:0;font-family:'Press Start 2P',monospace;font-weight:400;color:var(--yellow);text-shadow:3px 3px 0 var(--pink);display:flex;flex-direction:column;align-items:center;gap:6px;letter-spacing:0}
.title span{line-height:1}
.sub{color:var(--cyan);font-size:22px}
.cards{display:flex;flex-direction:column;gap:16px;padding:0 16px}
.card{border:4px solid var(--cyan);background:var(--card);padding:12px 14px;display:flex;flex-direction:column;gap:8px;box-shadow:6px 6px 0 var(--shadow)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.name{font-size:26px;color:var(--white)}
.next{font-size:20px;color:var(--green);text-align:right}
.acts{display:flex;gap:8px}.acts .btn{flex:1;min-height:46px;font-size:16px}.acts .btn.o{flex:0 0 64px}
/* afficheur LCD */
.lcd{display:inline-flex;align-items:flex-end;gap:8px;align-self:flex-start;background:var(--lcd);border:2px solid #3a3a22;padding:8px 12px;box-shadow:inset 0 0 12px rgba(0,0,0,.8)}
.seg{position:relative;display:inline-block;font-family:'DSEG7',monospace;font-weight:700;line-height:1;white-space:nowrap}
.seg .ghost{color:rgba(238,203,98,.09)}
.seg .val{position:absolute;right:0;top:0;color:var(--yellow);text-shadow:0 0 6px rgba(238,203,98,.55)}
.euro{font-family:'Pixelify Sans',sans-serif;font-weight:600;color:var(--yellow);line-height:.8}
/* compte */
.head{display:flex;flex-direction:column;gap:6px;padding:16px 16px 14px;border-bottom:4px solid var(--cyan)}
.lbl{font-size:22px;color:var(--cyan)}
.sect{padding:12px 16px 4px;font-size:16px;color:var(--pink)}
.hist{display:flex;flex-direction:column;padding:0 16px}
.hrow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:2px dotted #2c3e4a}
.hrow .d{color:var(--grey);width:60px;flex-shrink:0}.hrow .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hamt{display:inline-flex;align-items:center;gap:3px;background:var(--lcd);padding:3px 6px}
.hamt .s{font-family:'Pixelify Sans',sans-serif;font-weight:600;font-size:20px;line-height:1}
.hamt .n{display:inline-block;min-width:84px;text-align:right;font-family:'DSEG7',monospace;font-weight:700;font-size:17px;line-height:1}
.hamt.in{color:var(--green)}.hamt.in .n{text-shadow:0 0 5px rgba(134,196,111,.5)}
.hamt.out{color:var(--pink)}.hamt.out .n{text-shadow:0 0 5px rgba(210,122,159,.5)}
.more{display:flex;justify-content:center;padding:10px 0;color:var(--cyan);background:none;border:0;width:100%;font-size:22px}
.empty{color:var(--grey);padding:14px 0}
/* dépôt / retrait */
.opt{font-size:23px;line-height:1.5;padding:18px 16px 0}
.dash{height:4px;margin:12px 16px;background-image:repeating-linear-gradient(90deg,var(--cyan) 0,var(--cyan) 8px,transparent 8px,transparent 12px)}
.field{display:flex;flex-direction:column;gap:4px;padding:0 16px 12px}
.amt{display:flex;align-items:flex-end;gap:8px;border:3px solid var(--yellow);background:var(--lcd);padding:10px 12px;box-shadow:inset 0 0 12px rgba(0,0,0,.8);width:100%;text-align:right}
.amt .seg{flex:1;font-size:34px}
.amt.dim{border-color:#5a4a1c}
.motif{border:0;border-bottom:3px dotted var(--cyan);background:transparent;color:var(--white);font-family:'VT323',monospace;font-size:26px;padding:4px 0;outline:none;width:100%}
.codes{display:flex;gap:10px;align-items:center;background:none;border:0;padding:0}
.codes span{width:44px;height:52px;border:3px solid var(--pink);display:flex;align-items:center;justify-content:center;font-family:'Pixelify Sans',sans-serif;font-weight:600;font-size:29px;color:var(--white)}
.codes.dim span{border-color:#6e3a52}
.msg{min-height:26px;padding:0 16px;color:var(--red);font-size:22px}
.pad-keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:4px 16px 0}
.key{min-height:50px;background:var(--key);color:var(--white);border:0;border-bottom:4px solid #444;font-family:'Press Start 2P',monospace;font-weight:400;font-size:20px;line-height:1}
.key:active{transform:translateY(2px);border-bottom-width:2px}
.key.sm{font-family:'Pixelify Sans',sans-serif;font-weight:600;font-size:16px;color:var(--pink)}.key.c{color:var(--cyan)}
/* parents */
.ptitle{padding:12px 16px 8px;display:flex;align-items:baseline;gap:10px}
.pcard{border:3px solid var(--cyan);background:var(--card);padding:8px 12px;display:flex;flex-direction:column;gap:6px;margin:0 16px 10px}
.prow{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:22px}
.prow label{color:var(--cyan);white-space:nowrap}
.pin{display:flex;align-items:center;gap:6px;background:var(--lcd);border:2px solid var(--yellow);padding:5px 10px}
.pin input{width:96px;text-align:right;background:transparent;border:0;outline:none;color:var(--yellow);font-family:'DSEG7',monospace;font-weight:700;font-size:18px;text-shadow:0 0 5px rgba(238,203,98,.5)}
.sel,.date{max-width:170px;background:#000;border:2px solid var(--cyan);color:var(--white);font-family:'VT323',monospace;font-size:22px;padding:4px 6px;border-radius:0}
.date{color-scheme:dark}
.opts{display:flex;flex-direction:column;padding:0 16px;font-size:24px}
.opts .prow{padding:4px 0;border-bottom:2px dotted #2c3e4a}
.tog{min-width:88px;min-height:44px;border:0;border-bottom:4px solid #44693a;background:var(--green);color:#000;font-family:'Pixelify Sans',sans-serif;font-weight:600;font-size:16px}
.tog.off{background:#444;border-bottom-color:#222;color:var(--white)}
.tog.pk{background:#000;color:var(--pink);border:3px solid var(--pink)}
.note{padding:6px 16px 0;font-size:19px;color:var(--grey)}
.plan{font-size:19px;color:var(--grey)}
/* game over / succès */
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:0 16px;text-align:center}
.go{margin:0;font-family:'Pixelify Sans',sans-serif;font-weight:700;font-size:48px;line-height:1.1;color:var(--red);text-shadow:4px 4px 0 #4a1c18}
.coin{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0 0 18%,var(--yellow) 19% 60%,#b8822e 61%);box-shadow:0 0 0 3px #7a5a1c;animation:jump .9s steps(6) 2}
@keyframes jump{0%{transform:translateY(0)}50%{transform:translateY(-40px) scaleX(.4)}100%{transform:translateY(0)}}
.toast{position:absolute;left:16px;right:16px;bottom:calc(90px + env(safe-area-inset-bottom));background:var(--card);border:3px solid var(--yellow);color:var(--yellow);padding:10px 12px;text-align:center;font-size:22px;z-index:5}
.setup{padding:24px 16px;font-size:22px;line-height:1.3}
.setup code{color:var(--yellow)}
</style>

/* ---------- utilitaires ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cents2dot = c => (Math.abs(c) / 100).toFixed(2);
const cents2txt = c => (c / 100).toFixed(2).replace('.', ',') + ' €';
function parts(d, opts) {
  const o = {};
  new Intl.DateTimeFormat('fr-FR', { timeZone: TZ, ...opts }).formatToParts(new Date(d)).forEach(p => o[p.type] = p.value);
  return o;
}
const wd = d => parts(d, { weekday: 'short' }).weekday.replace('.', '').toUpperCase().slice(0, 3);
const ddmm = d => { const p = parts(d, { day: '2-digit', month: '2-digit' }); return p.day + '/' + p.month; };
const hhmm = d => { const p = parts(d, { hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }); return p.hour + 'H' + p.minute; };
const todayISO = () => new Intl.DateTimeFormat('en-CA', { timeZone: TZ }).format(new Date());
const child = id => S.data?.children.find(c => c.id === id);
function freqTxt(s) {
  if (!s) return '';
  return s.freq === 'weekly' ? 'CHAQUE ' + WEEKDAYS[s.weekday] : 'LE ' + (s.monthday === 1 ? '1ER' : s.monthday) + ' DU MOIS';
}
function parseAmount(str) {
  const t = String(str).trim().replace(',', '.');
  if (!/^\d{0,4}(\.\d{0,2})?$/.test(t) || t === '' || t === '.') return null;
  return Math.round(parseFloat(t) * 100);
}

/* ---------- serveur ---------- */
async function rpc(fn, args = {}) {
  const r = await fetch(`${CONFIG.url}/rest/v1/rpc/${fn}`, {
    method: 'POST',
    headers: { apikey: CONFIG.key, 'Content-Type': 'application/json' },
    body: JSON.stringify(args)
  });
  if (!r.ok) throw new Error(r.status + ' ' + await r.text());
  S.online = true;
  return r.json();
}
async function refresh() {
  try {
    S.data = await rpc('rob_get_state');
    S.sounds = S.data.sounds;
  } catch (e) { S.online = false; console.error(e); }
  S.loading = false;
  render();
}
async function loadHistory(reset) {
  if (reset) { S.history = []; S.histDone = false; }
  try {
    const rows = await rpc('rob_get_history', { p_child: S.child, p_limit: 20, p_offset: S.history.length });
    S.history = S.history.concat(rows);
    S.histDone = rows.length < 20;
  } catch (e) { S.online = false; }
  render();
}

/* ---------- sons 8-bit ---------- */
let AC = null;
function tone(seq) {
  if (!S.sounds) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    let t = AC.currentTime;
    seq.forEach(([f, d]) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = 'square'; o.frequency.value = f;
      g.gain.setValueAtTime(0.06, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
      o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d); t += d * 0.9;
    });
  } catch (e) {}
}
const sfx = {
  key:   () => tone([[880, .04]]),
  coin:  () => tone([[988, .08], [1319, .35]]),
  out:   () => tone([[660, .08], [440, .2]]),
  error: () => tone([[392, .15], [330, .15], [262, .4]]),
  ok:    () => tone([[523, .08], [659, .08], [784, .2]])
};

/* ---------- morceaux d'écran ---------- */
function lcd(cents, size, euro) {
  return `<div class="lcd"><span class="seg" style="font-size:${size}px"><span class="ghost">8888.88</span><span class="val">${cents2dot(cents)}</span></span><span class="euro" style="font-size:${euro}px">€</span></div>`;
}
function bar() {
  const now = new Date();
  let st = S.online ? '<span style="color:var(--green)">● CONNECTÉ</span>' : '<span style="color:var(--red)">● HORS LIGNE</span>';
  if (S.view === 'parents' || S.view === 'newcode') st = '<span style="color:var(--yellow)">● MODE PARENT</span>';
  return `<div class="bar"><span>3615 OTTER</span><span id="clock">${wd(now)} ${ddmm(now)} ${hhmm(now)}</span>${st}</div>`;
}
function foot(a, b) { return `<div class="foot">${a}${b}</div>`; }
const B = (act, txt, cls = '', extra = '') => `<button class="btn ${cls}" data-act="${act}" ${extra}>${txt}</button>`;
function keypad(withComma) {
  const k = n => `<button class="key" data-act="key" data-k="${n}">${n}</button>`;
  return `<div class="pad-keys">${[1,2,3,4,5,6,7,8,9].map(k).join('')}
    <button class="key sm" data-act="key" data-k="del">CORR.</button>${k(0)}
    ${withComma ? '<button class="key c" data-act="key" data-k=",">,</button>' : '<span></span>'}</div>`;
}
function codeBoxes(code, active) {
  let h = '';
  for (let i = 0; i < 4; i++) h += `<span>${i < code.length ? '*' : (i === code.length && active ? '<span class="blink">_</span>' : '')}</span>`;
  return h;
}

function vHome() {

  const shown = S.amount === '' ? '0' : S.amount.replace(',', '.');
  return `<div class="main">
    <div class="opt px" style="color:${dep ? 'var(--green)' : 'var(--pink)'}">${dep ? '+ DÉPÔT' : '− RETRAIT'}<br><span style="color:var(--white)">${dep ? '→' : '←'} ${esc(c.name.toUpperCase())}</span></div>
    <div class="dash"></div>
    <div class="field"><span class="lbl">MONTANT</span>
      <button class="amt ${S.target === 'amount' ? '' : 'dim'}" data-act="target" data-t="amount" aria-label="Montant">
        <span class="seg"><span class="ghost">8888.88</span><span class="val">${esc(shown)}</span></span><span class="euro" style="font-size:44px">€</span></button></div>
    <div class="field"><label class="lbl" for="motif">MOTIF</label>
      <input id="motif" class="motif" maxlength="40" placeholder="${dep ? 'Cadeau, récompense...' : 'Liquide, achat...'}" value="${esc(S.label)}"></div>
    <div class="field"><span class="lbl" style="color:var(--pink)">CODE PARENT</span>
      <button class="codes ${S.target === 'code' ? '' : 'dim'}" data-act="target" data-t="code" aria-label="Code parent">${codeBoxes(S.code, S.target === 'code')}</button></div>
    <div class="msg">${esc(S.msg)}</div>
    ${keypad(S.target === 'amount')}
    <div class="grow"></div></div>
    ${foot(B('home', 'ANNULATION'), B('sendOp', 'ENVOI ▶', 'g'))}`;
}

function vCodeScreen(title, sub, act) {
  return `<div class="main">
    <div class="opt px" style="color:var(--yellow)">${title}<br><span style="color:var(--white);font-size:20px">${sub}</span></div>
    <div class="dash"></div>
    <div class="field" style="align-items:center"><div class="codes">${codeBoxes(S.code, true)}</div></div>
    <div class="msg" style="text-align:center">${esc(S.msg)}</div>
    ${keypad(false)}<div class="grow"></div></div>
    ${foot(B(S.view === 'newcode' ? 'parents' : 'home', 'ANNULATION'), B(act, 'ENVOI ▶', 'g'))}`;
}

function vParents() {
  const today = todayISO();
  const cards = S.data.children.map(c => {
    const f = S.forms[c.id];
    const days = f.freq === 'weekly'
      ? WEEKDAYS.slice(1).map((w, i) => `<option value="${i + 1}" ${+f.weekday === i + 1 ? 'selected' : ''}>${w}</option>`).join('')
      : Array.from({ length: 28 }, (_, i) => `<option value="${i + 1}" ${+f.monthday === i + 1 ? 'selected' : ''}>LE ${i ? i + 1 : '1ER'}</option>`).join('');
    const plan = c.planned ? `<div class="plan">Prévu le ${ddmm(c.planned.effective_from + 'T12:00:00')} : ${cents2txt(c.planned.amount_cents)} ${freqTxt(c.planned)}</div>` : '';
    return `<div class="pcard"><span class="px" style="font-size:20px;color:var(--white)">${esc(c.name.toUpperCase())}</span>
      <div class="prow"><label for="a${c.id}">MONTANT</label><div class="pin"><input id="a${c.id}" inputmode="decimal" data-f="amount" data-c="${c.id}" value="${esc(f.amount)}"><span class="euro" style="font-size:27px">€</span></div></div>
      <div class="prow"><label for="q${c.id}">FRÉQUENCE</label>
        <select class="sel" id="q${c.id}" data-f="freq" data-c="${c.id}"><option value="weekly" ${f.freq === 'weekly' ? 'selected' : ''}>CHAQUE SEMAINE</option><option value="monthly" ${f.freq === 'monthly' ? 'selected' : ''}>CHAQUE MOIS</option></select></div>
      <div class="prow"><label for="j${c.id}">JOUR</label>
        <select class="sel" id="j${c.id}" data-f="${f.freq === 'weekly' ? 'weekday' : 'monthday'}" data-c="${c.id}">${days}</select></div>
      <div class="prow"><label for="e${c.id}">À PARTIR DU</label><input type="date" class="date" id="e${c.id}" min="${today}" data-f="from" data-c="${c.id}" value="${esc(f.from)}"></div>
      ${plan}</div>`;
  }).join('');
  return `<div class="main">
    <div class="ptitle"><span class="px" style="font-size:23px;color:var(--yellow)">GUIDE</span><span style="font-size:20px;color:var(--cyan)">RÉGLAGES ARGENT DE POCHE</span></div>
    ${cards}
    <div class="opts">
      <div class="prow"><span>SONS 8-BIT</span><button class="tog ${S.forms.sounds ? '' : 'off'}" data-act="sounds">${S.forms.sounds ? 'ON' : 'OFF'}</button></div>
      <div class="prow"><span>CODE PARENT</span><button class="tog pk" data-act="newcode">CHANGER</button></div>
    </div>
    <div class="note">Effet à la date choisie, le passé ne change pas.</div>
    <div class="msg">${esc(S.msg)}</div><div class="grow"></div></div>
    ${foot(B('leaveParents', 'ANNULATION'), B('saveParents', 'ENVOI ▶', 'g'))}`;
}

function vOver() {
  const o = S.over;
  const line = o.error === 'locked'
    ? `<div style="font-size:24px;color:var(--yellow)">ACCÈS BLOQUÉ JUSQU'À ${hhmm(o.until)}</div>`
    : `<div style="font-size:24px;color:var(--yellow)">${o.remaining} ESSAI${o.remaining > 1 ? 'S' : ''} RESTANT${o.remaining > 1 ? 'S' : ''}</div>`;
  return `<div class="main"><div class="center">
    <svg viewBox="0 0 100 84" width="128" shape-rendering="crispEdges" role="img" aria-label="Loutre">${OTTER}</svg>
    <h1 class="go">GAME<br>OVER</h1>
    <div style="font-size:28px;color:var(--white)">CODE INCORRECT</div>${line}
    <div style="font-size:20px;color:var(--grey);max-width:300px">Après 3 erreurs, l'accès est bloqué 15 minutes.</div>
    <div class="blink px" style="font-size:16px;color:var(--cyan)">APPUIE SUR RETOUR</div></div></div>
    ${foot(B('overBack', 'RETOUR'), B('home', 'SOMMAIRE'))}`;
}

function vSuccess() {
  const s = S.success;
  return `<div class="main"><div class="center">
    <div class="coin"></div>
    <div class="px" style="font-size:26px;color:${s.dep ? 'var(--green)' : 'var(--pink)'}">${s.dep ? 'DÉPÔT' : 'RETRAIT'} ENREGISTRÉ</div>
    <div class="px" style="font-size:22px;color:var(--white)">${esc(s.name)}</div>
    <span class="lbl">NOUVEAU SOLDE</span>${lcd(s.balance, 34, 44).replace('align-self:flex-start', '')}
  </div></div>${foot(B('see', 'VOIR LE COMPTE', '', `data-c="${s.child}"`), B('home', 'SOMMAIRE', 'g'))}`;
}

function vSetup() {
  return `<div class="main"><div class="setup">
    <div class="px" style="color:var(--yellow);font-size:24px">RÉGLAGE À FAIRE</div><br>
    Ouvrez <code>index.html</code> et remplacez en haut du script <code>VOTRE-PROJET</code> et <code>VOTRE_CLE_PUBLISHABLE</code>
    par l'adresse et la clé publishable de votre projet Supabase (voir README).</div></div>`;
}

/* ---------- rendu ---------- */
function render() {
  let h;
  if (CONFIG.url.includes('VOTRE-PROJET')) h = vSetup();
  else if (S.view === 'compte') h = vCompte();
  else if (S.view === 'op') h = vOp();
  else if (S.view === 'parentsLogin') h = vCodeScreen('GUIDE', 'CODE PARENT', 'loginParents');
  else if (S.view === 'parents') h = vParents();
  else if (S.view === 'newcode') h = vCodeScreen('NOUVEAU CODE', S.ncStep === 1 ? 'TAPE LE NOUVEAU CODE' : 'CONFIRME LE NOUVEAU CODE', 'sendNewCode');
  else if (S.view === 'over') h = vOver();
  else if (S.view === 'success') h = vSuccess();
  else h = vHome();
  $app.innerHTML = bar() + h + (S.toast ? `<div class="toast">${esc(S.toast)}</div>` : '');
}
function go(view) { S.view = view; S.msg = ''; render(); }
function toast(t) { S.toast = t; render(); setTimeout(() => { S.toast = ''; render(); }, 2200); }

/* ---------- actions ---------- */
function startParentsForms() {
  const today = todayISO();
  S.forms = { sounds: S.sounds };
  S.data.children.forEach(c => {
    const s = c.planned || c.current || { amount_cents: 500, freq: 'weekly', weekday: 6, monthday: 1 };
    S.forms[c.id] = {
      amount: (s.amount_cents / 100).toFixed(2), freq: s.freq, weekday: s.weekday || 6, monthday: s.monthday || 1,
      from: c.planned ? c.planned.effective_from : today, dirty: false
    };
  });
}
function handleError(res, backView) {
  if (res.error === 'bad_code' || res.error === 'locked') {
    sfx.error(); S.over = res; S.back = backView; S.code = ''; go('over'); return;
  }
  sfx.error();
  S.msg = ({ insufficient: 'SOLDE INSUFFISANT (' + cents2txt(res.balance_cents || 0) + ')',
             too_big: 'PLAFOND : 9999,99 € PAR TIRELIRE', bad_amount: 'MONTANT INVALIDE',
             past_date: 'LA DATE NE PEUT PAS ÊTRE PASSÉE', bad_new_code: 'LE CODE DOIT FAIRE 4 CHIFFRES' }[res.error]) || 'ERREUR : ' + res.error;
  render();
}

const A = {
  async reload() { S.loading = true; render(); await refresh(); },
  home() { S.code = ''; S.parentCode = null; go('home'); refresh(); },
  see(d) { S.child = +d.c; go('compte'); loadHistory(true); },
  more() { loadHistory(false); },
  op(d) { S.child = +d.c; S.kind = d.k; S.amount = ''; S.label = ''; S.code = ''; S.target = 'amount'; go('op'); },
  target(d) { S.target = d.t; render(); },
  key(d) {
    sfx.key(); const k = d.k;
    if (S.view === 'op' && S.target === 'amount') {
      if (k === 'del') S.amount = S.amount.slice(0, -1);
      else {
        const n = S.amount + (k === ',' ? (S.amount.includes(',') ? '' : (S.amount === '' ? '0,' : ',')) : k);
        if (/^\d{0,4}(,\d{0,2})?$/.test(n)) S.amount = n;
      }
    } else {
      if (k === 'del') S.code = S.code.slice(0, -1);
      else if (k !== ',' && S.code.length < 4) S.code += k;
      if (S.view === 'op' && S.code.length === 4) S.target = 'code';
    }
    S.msg = ''; render();
  },
  async sendOp() {
    const cents = parseAmount(S.amount);
    if (!cents) { sfx.error(); S.msg = 'TAPE UN MONTANT'; S.target = 'amount'; return render(); }
    if (S.code.length !== 4) { sfx.error(); S.msg = 'TAPE LE CODE PARENT'; S.target = 'code'; return render(); }
    try {
      const res = await rpc('rob_add_transaction', { p_code: S.code, p_child: S.child, p_kind: S.kind, p_amount_cents: cents, p_label: S.label });
      if (!res.ok) return handleError(res, 'op');
      const dep = S.kind === 'deposit'; dep ? sfx.coin() : sfx.out();
      S.success = { dep, name: child(S.child).name.toUpperCase(), balance: res.balance_cents, child: S.child };
      S.code = ''; go('success'); refresh();
    } catch (e) { S.online = false; sfx.error(); S.msg = 'PAS DE CONNEXION, RÉESSAIE'; render(); }
  },
  parents() { if (!S.data) return; S.code = ''; go('parentsLogin'); },
  async loginParents() {
    if (S.code.length !== 4) { S.msg = 'TAPE LES 4 CHIFFRES'; return render(); }
    try {
      const res = await rpc('rob_verify', { p_code: S.code });
      if (!res.ok) return handleError(res, 'parentsLogin');
      sfx.ok(); S.parentCode = S.code; S.code = ''; startParentsForms(); go('parents');
    } catch (e) { S.online = false; S.msg = 'PAS DE CONNEXION'; render(); }
  },
  sounds() { S.forms.sounds = !S.forms.sounds; render(); },
  leaveParents() { S.parentCode = null; go('home'); },
  newcode() { S.code = ''; S.ncStep = 1; go('newcode'); },
  async sendNewCode() {
    if (S.code.length !== 4) { S.msg = 'TAPE LES 4 CHIFFRES'; return render(); }
    if (S.ncStep === 1) { S.newCode1 = S.code; S.code = ''; S.ncStep = 2; return go('newcode'); }
    if (S.code !== S.newCode1) { sfx.error(); S.code = ''; S.ncStep = 1; S.msg = 'LES DEUX CODES DIFFÈRENT'; return render(); }
    try {
      const res = await rpc('rob_change_code', { p_code: S.parentCode, p_new_code: S.code });
      if (!res.ok) return handleError(res, 'home');
      S.parentCode = S.code; S.code = ''; sfx.ok(); go('parents'); toast('NOUVEAU CODE ENREGISTRÉ');
    } catch (e) { S.online = false; S.msg = 'PAS DE CONNEXION'; render(); }
  },
  async saveParents() {
    const today = todayISO();
    const todo = [];
    for (const c of S.data.children) {
      const f = S.forms[c.id];
      if (!f.dirty) continue;
      const cents = parseAmount(f.amount);
      if (cents === null || cents > 99999) { S.msg = 'MONTANT INVALIDE POUR ' + c.name.toUpperCase(); sfx.error(); return render(); }
      if (!f.from || f.from < today) { S.msg = 'DATE PASSÉE POUR ' + c.name.toUpperCase(); sfx.error(); return render(); }
      todo.push({ p_code: S.parentCode, p_child: c.id, p_amount_cents: cents, p_freq: f.freq,
                  p_weekday: f.freq === 'weekly' ? +f.weekday : null, p_monthday: f.freq === 'monthly' ? +f.monthday : null,
                  p_effective_from: f.from });
    }
    try {
      for (const t of todo) { const r = await rpc('rob_set_schedule', t); if (!r.ok) return handleError(r, 'home'); }
      if (S.forms.sounds !== S.sounds) { const r = await rpc('rob_set_sounds', { p_code: S.parentCode, p_on: S.forms.sounds }); if (!r.ok) return handleError(r, 'home'); }
      S.parentCode = null; sfx.ok(); await refresh(); go('home'); toast('RÉGLAGES ENREGISTRÉS');
    } catch (e) { S.online = false; S.msg = 'PAS DE CONNEXION'; render(); }
  },
  overBack() { S.code = ''; S.msg = ''; go(S.back === 'op' ? 'op' : S.back === 'parentsLogin' ? 'parentsLogin' : 'home'); }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  e.preventDefault();
  A[el.dataset.act]?.(el.dataset);
});
document.addEventListener('input', e => {
  if (e.target.id === 'motif') S.label = e.target.value;
  const f = e.target.dataset.f;
  if (f === 'amount' && e.target.value.includes(',')) e.target.value = e.target.value.replace(',', '.');
  if (f && S.forms[e.target.dataset.c]) { S.forms[e.target.dataset.c][f] = e.target.value; S.forms[e.target.dataset.c].dirty = true; }
});
document.addEventListener('change', e => { if (e.target.dataset.f === 'freq') render(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && ['home', 'compte'].includes(S.view)) refresh(); });
setInterval(() => {
  const c = document.getElementById('clock'); const n = new Date();
  if (c) c.textContent = `${wd(n)} ${ddmm(n)} ${hhmm(n)}`;
  if (S.view === 'home' && !document.hidden) refresh();
}, 60000);

render();
if (!CONFIG.url.includes('VOTRE-PROJET')) refresh();
</script>
</body>
</html>
